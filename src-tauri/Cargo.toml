[package]
name = "daprod-avatar"
version = "0.6.0"
description = "DaProd Avatar: piccolo sul desktop, si espande quando serve. Cassetti, conversioni, editing."
edition = "2021"
rust-version = "1.77"

[lib]
name = "daprod_avatar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "daprod-avatar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rodio = { version = "=0.20.1", features = ["symphonia-aac", "symphonia-isomp4"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time"] }

# clipboard GTK, pixbuf e portale XDG: solo Linux (su Windows si compila senza)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
gdk-pixbuf = "=0.18.5"
ashpd = "=0.12.3"
