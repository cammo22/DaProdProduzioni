name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundle: appimage
          - platform: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: dipendenze linux (webkitgtk, gtk3, alsa, pixbuf)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libgdk-pixbuf-2.0-dev libasound2-dev

      - name: build + release con tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DaProdProduzioni ${{ github.ref_name }}"
          releaseBody: "Vedi wiki e Changelog per i dettagli della versione."
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundle }}
